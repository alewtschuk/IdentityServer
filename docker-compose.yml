x-id-server: &id-server
  image: identityserver
  # the client service builds this image; never try to pull it from Docker Hub
  pull_policy: never
  # each server runs its own redis and RMI registry inside its container (run-server.sh)
  command: ["./run-server.sh", "5128"]
  networks:
    - id-net

services:
  # Servers must match the hostnames listed in docker.server (the TLS certificate is
  # generated from that file). To add a server, copy a block and add it there too.
  id-server-1:
    <<: *id-server
    hostname: id-server-1

  id-server-2:
    <<: *id-server
    hostname: id-server-2

  id-server-3:
    <<: *id-server
    hostname: id-server-3

  # idle container on the same network, used to run IdClient (docker compose exec client ...).
  # It is the only service that builds the image, so every container shares one
  # image and therefore one TLS certificate.
  client:
    build: .
    image: identityserver
    depends_on:
      - id-server-1
      - id-server-2
      - id-server-3
    networks:
      - id-net
    init: true
    command: tail -f /dev/null

networks:
  id-net:
    driver: bridge
